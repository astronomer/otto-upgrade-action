[project]
name = "otto-upgrade-action"
version = "0.0.0"
description = "Scripts for the Otto Airflow Upgrade GitHub Action"
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 110
target-version = "py310"
# Verbatim copies of the Astro CLI's integrity-test templates; kept identical to upstream.
extend-exclude = ["scripts/parse_probe/dag_integrity_default_af*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# Verbatim astro CLI help lines (the flag-probe fixtures) exceed the limit.
"tests/test_verify_build_secrets.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
